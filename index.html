<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTM Test Site</title>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-PNB7QBCN');</script>
  <!-- End Google Tag Manager -->

</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PNB7QBCN"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <h1>GTM Test Site</h1>

  <div>
    <h2>Test Actions</h2>

    <button id="btn-cta" onclick="trackCTA()">Click CTA Button</button>
    <br><br>
    <button id="btn-product" onclick="trackProduct()">View Product</button>
    <br><br>
    <button id="btn-purchase" onclick="trackPurchase()">Complete Purchase</button>

  </div>

  <!-- Data Layer -->
  <script>
    window.dataLayer = window.dataLayer || [];

    function trackCTA() {
      dataLayer.push({
        event: 'cta_click',
        button_text: 'Click CTA Button',
        page_section: 'hero'
      });
      alert('CTA Click event pushed to data layer');
    }

    function trackProduct() {
      dataLayer.push({
        event: 'view_item',
        ecommerce: {
          currency: 'USD',
          value: 29.99,
          items: [{
            item_id: 'PROD_001',
            item_name: 'Test Product',
            item_category: 'Test Category',
            price: 29.99,
            quantity: 1
          }]
        }
      });
      alert('View Item event pushed to data layer');
    }

    function trackPurchase() {
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'purchase',
        ecommerce: {
          transaction_id: 'TXN_' + Date.now(),
          currency: 'USD',
          value: 29.99,
          items: [{
            item_id: 'PROD_001',
            item_name: 'Test Product',
            item_category: 'Test Category',
            price: 29.99,
            quantity: 1
          }]
        }
      });
      alert('Purchase event pushed to data layer');
    }
  </script>

</body>
</html>
